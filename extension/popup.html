<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; width: 280px; padding: 14px; margin: 0; }
      h1 { font-size: 14px; margin: 0 0 8px; }
      p { font-size: 12px; color: #555; margin: 0 0 10px; line-height: 1.4; }
      .btn { display: block; width: 100%; box-sizing: border-box; text-align: center; background: #128c7e; color: #fff; padding: 8px; border-radius: 6px; text-decoration: none; font-size: 13px; font-weight: 600; border: 0; cursor: pointer; margin-top: 8px; }
      .secondary { background: #eef2f3; color: #111; }
      #status { min-height: 16px; font-size: 11px; color: #555; margin-top: 8px; }
    </style>
  </head>
  <body>
    <h1>CRM Assinaturas v0.18.42</h1>
    <p>Abra o WhatsApp Web para usar. Se o painel não aparecer sozinho, clique no botão abaixo.</p>
    <button class="btn" id="show-panel">Mostrar painel no WhatsApp</button>
    <a class="btn" href="https://web.whatsapp.com" target="_blank">Abrir WhatsApp Web</a>
    <div id="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
